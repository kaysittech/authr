# ==========================================
# Authr - Google Cloud Build CI/CD Pipeline
# Automatically builds and deploys to Cloud Run on GitHub Push
# ==========================================
steps:
  # 1. Build Docker image using Artifact Registry / Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/authr-backend:$COMMIT_SHA', '.']

  # 2. Push image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/authr-backend:$COMMIT_SHA']

  # 3. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'authr-backend-service'
      - '--image=gcr.io/$PROJECT_ID/authr-backend:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=ENV=production'

images:
  - 'gcr.io/$PROJECT_ID/authr-backend:$COMMIT_SHA'
